plugins { id 'com.android.application' }

// A release key belongs to the app owner; it is never included in this project.
def signingFile = rootProject.file('keystore.properties')
def signingProperties = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
def hasReleaseKey = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
    signingProperties.getProperty(it)?.trim()
}

android {
    namespace 'pl.katarzynaekasicka.odgadnijflage'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'pl.katarzynaekasicka.odgadnijflage'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        resConfigs 'pl', 'en'
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('.local/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKey) {
            release {
                storeFile rootProject.file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-test'
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseKey) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.webkit:webkit:1.14.0'
}

// A reproducible, local-only debug setup, including on a fresh Android Studio checkout.
def debugStore = rootProject.file('.local/debug.keystore')
def ensureDebugKey = tasks.register('ensureDebugKey', Exec) {
    onlyIf { !debugStore.exists() }
    doFirst { debugStore.parentFile.mkdirs() }
    def suffix = System.getProperty('os.name').toLowerCase().contains('windows') ? '.exe' : ''
    commandLine new File(System.getProperty('java.home'), 'bin/keytool' + suffix).absolutePath,
        '-genkeypair', '-noprompt', '-keystore', debugStore.absolutePath,
        '-storepass', 'android', '-alias', 'androiddebugkey', '-keypass', 'android',
        '-dname', 'CN=Android Debug,O=Android,C=US', '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000'
}
tasks.matching { it.name == 'validateSigningDebug' }.configureEach { dependsOn ensureDebugKey }

// Monorepo builds use the website in ../index.html. The downloadable project
// carries the same pinned source in game-source/index.html for standalone builds.
def gameSource = rootProject.file('../index.html').exists()
    ? rootProject.file('../index.html') : rootProject.file('game-source/index.html')
def generatedAssets = layout.buildDirectory.dir('generated/game-assets')
def prepareGameAssets = tasks.register('prepareGameAssets') {
    inputs.files(gameSource, rootProject.file('native-hooks.js'), rootProject.file('native.css'))
    outputs.dir(generatedAssets)
    doLast {
        if (!gameSource.exists()) throw new GradleException('Missing game-source/index.html. Use the complete project ZIP.')
        def html = gameSource.getText('UTF-8')
        if (!html.contains('data-standalone') || html.contains('<script src=')) {
            throw new GradleException('The Android build requires the self-contained game HTML, including its graphics.')
        }
        html = html.replace('</head>', '<style>\n' + rootProject.file('native.css').getText('UTF-8') + '\n</style>\n</head>')
        html = html.replace('</body>', '<script>\n' + rootProject.file('native-hooks.js').getText('UTF-8') + '\n</script>\n</body>')
        def output = new File(generatedAssets.get().asFile, 'www/index.html')
        output.parentFile.mkdirs()
        output.setText(html, 'UTF-8')
    }
}
android.sourceSets.main.assets.srcDir(generatedAssets)
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn prepareGameAssets }
